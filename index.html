<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <script src="script.js"></script>
    <script src="db.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="icons.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="overlay.css">
    <link rel="stylesheet" href="responsive.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
    <title>Pokedex</title>
</head>

<body onload="init()">
    <header>
        <div class="loading-screen" id="loadingScreen">
            <div class="pokeball"></div>
        </div>
        <div class="header-title">
            <div class="pokeball header"></div>
            <h1 class="pokeball-title">Pokedex</h1>
        </div>
        <div class="header-controls">
            <input class="search-filter" type="text" id="searchInput" placeholder="Search Pokémon...">
            <button id="searchBtn" class="search-button">
                <h3 class="search-button-text">Search</h3>
            </button>
            <p id="searchMessage" class="search-message"></p>
        </div>
    </header>
    <div class="pokemon-list" id="pokemonList"></div>
    <div id="pokemonOverlay" class="overlay">
        <div class="overlay-header">
            <div class="overlay-nav">
                <button id="prevBtn" class="nav-btn prev">&#8592;</button>
                <button id="nextBtn" class="nav-btn next">&#8594;</button>
            </div>
            <div id="overlayContent" class="overlay-content">
                <img class="overlay-img" id="overlayImg" src="" alt="">
                <h2 id="overlayName" class="overlay-name"></h2>
                <div class="overlay-tabs">
                    <button id="mainTab">Main</button>
                    <button id="statsTab">Stats</button>
                    <button id="evochainTab">EvoChain</button>
                </div>
            </div>
            <div class="overlay-main-content">
                <div class="overlay-tab-content tab-main" id="main"></div>
                <div class="overlay-tab-content tab-stats" id="stats"></div>
                <div class="overlay-tab-content tab-evochain" id="evochain"></div>
            </div>
        </div>
    </div>
    <div class="footer">
        <button class="load-more-button" id="loadMoreBtn">Load More</button>
    </div>
</body>

</html>
